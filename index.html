<style>

    --muted: #64748b;
    --border: #cbd5e1;
  }
  * { box-sizing: border-box; }

    padding: 20px 16px;

    max-width: 700px;

    background: linear-gradient(120deg, #1e3a8a 0%, #2563eb 60%, #0d9488 100%);

    margin-bottom: 20px;
  }

    font-size: 1.28rem;
    margin: 0 0 6px 0;
    color: #ffffff;
    letter-spacing: 0.2px;
  }
  .subtitle {
    font-size: 0.9rem;
    color: #dbeafe;
    margin: 0;
    font-weight: 500;
  }
  .notice {
    background: linear-gradient(to right, #fffbeb, #fef3c7);
    border: 1px solid #fcd34d;
    border-left: 5px solid #f59e0b;
    color: #92400e;
    padding: 11px 16px;
    border-radius: 8px;
    font-size: 0.86rem;
    max-width: 560px;
    margin: 0 auto 22px auto;
    text-align: center;
    box-shadow: 0 2px 6px rgba(245, 158, 11, 0.12);
  }
  .card-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-top: 4px solid #2563eb;
    border-radius: 12px;
    padding: 18px;
    margin: 0 22px 20px 22px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }
  .card-box:last-of-type {
    border-top-color: #0d9488;
    margin-bottom: 0;
  }
  label {
    display: block;
    font-weight: 700;
    font-size: 0.96rem;
    margin-bottom: 10px;
    color: #1e3a8a;
  }
  .card-box:last-of-type label {
    color: #0f766e;
  }
  select, input {
    width: 100%;
    padding: 11px 12px;
    font-size: 0.98rem;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  select:focus, input:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .card-box:last-of-type select:focus {
    border-color: #0d9488;
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
  }
  input {
    margin-bottom: 10px;
    font-size: 0.92rem;
  }
  .badge {
    display: inline-block;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #ffffff;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 0.84rem;
    margin-top: 14px;
    box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
  }
  .card-box:last-of-type .badge {
    background: linear-gradient(135deg, #0d9488, #0f766e);
    box-shadow: 0 2px 6px rgba(13, 148, 136, 0.25);
  }
  ul {
    list-style: none;
    padding: 0;
    margin: 12px 0 0 0;
  }
  li {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-left: 4px solid #3b82f6;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-weight: 500;
    font-size: 0.94rem;
    transition: transform 0.15s, background-color 0.15s;
  }
  .card-box:last-of-type li {
    border-left-color: #14b8a6;
  }
  li:hover {
    background: #eff6ff;
    transform: translateX(3px);
  }
  .card-box:last-of-type li:hover {
    background: #f0fdfa;
  }
  .empty {
    color: var(--muted);
    font-style: italic;
    margin-top: 12px;
    font-size: 0.92rem;
  }
  @media (max-width: 520px) {
    .card-box { margin: 0 14px 16px 14px; }

  }

  const facSelect = document.getElementById("facultySelect");
  const sessionSelect = document.getElementById("sessionSelect");

  function populateFacultyDropdown(filterText = "") {
    const currentVal = facSelect.value;
    facSelect.innerHTML = '<option value="">-- Select Invigilator --</option>';
    const query = filterText.toLowerCase().trim();
    scheduleData.facultyList
      .filter(name => name.toLowerCase().includes(query))
      .forEach(name => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        facSelect.appendChild(opt);
      });
    if ([...facSelect.options].some(o => o.value === currentVal)) {
      facSelect.value = currentVal;
    }
  }

  function filterFacultyDropdown() {
    populateFacultyDropdown(document.getElementById("facultySearch").value);
    showFacultyDuties();
  }

  scheduleData.sessionList.forEach(sess => {
    const opt = document.createElement("option");
    opt.value = sess;
    opt.textContent = sess;
    sessionSelect.appendChild(opt);
  });

  populateFacultyDropdown();

  function showFacultyDuties() {
    const fac = facSelect.value;
    const resDiv = document.getElementById("facultyResult");
    if (!fac) { resDiv.innerHTML = ""; return; }
    const duties = scheduleData.byFaculty[fac] || [];
    if (duties.length === 0) {
      resDiv.innerHTML = `<p class="empty">No invigilation duties assigned to ${fac}.</p>`;
    } else {
      const items = duties.map((d, i) => `<li><strong>${i + 1}.</strong> ${d}</li>`).join("");
      resDiv.innerHTML = `<span class="badge">Total Duties: ${duties.length}</span><ul>${items}</ul>`;
    }
  }

  function showSessionFaculty() {
    const sess = sessionSelect.value;
    const resDiv = document.getElementById("sessionResult");
    if (!sess) { resDiv.innerHTML = ""; return; }
    const facs = scheduleData.bySession[sess] || [];
    if (facs.length === 0) {
      resDiv.innerHTML = `<p class="empty">No invigilators assigned for ${sess}.</p>`;
    } else {
      const items = facs.map((f, i) => `<li><strong>${i + 1}.</strong> ${f}</li>`).join("");
      resDiv.innerHTML = `<span class="badge">Invigilators Assigned: ${facs.length}</span><ul>${items}</ul>`;
    }
  }
</script>
